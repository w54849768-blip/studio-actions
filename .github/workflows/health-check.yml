name: health-check
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe sites
        run: |
          {
            echo "# Site health check"
            echo ""
            echo "Run: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            for u in "http://92.118.206.166:30087/" "https://recent.design" "https://github.com"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 -L "$u" || echo "ERR")
              echo "- $u -> $code"
            done
          } > status.md
          cat status.md
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.md
          git diff --cached --quiet || git commit -m "health check $(date -u +%F)"
          git push
